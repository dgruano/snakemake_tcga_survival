# filepath: profiles/default/config.yaml
#printshellcmds: true
#verbose: true
#benchmark-extended: true
executor: slurm
jobs: 30
keep-going: true
rerun-incomplete: true
scheduler: greedy
use-conda: true
latency-wait: 45
# max resources
resources:
  mem_mb: 500000
  cpus: 100

set-threads:
  TCGA_download: 3
  rule_separate_cohorts: 3
  biomaRt_download: 2
  DESeq2_normalization: 2
  survival_screening: 2
  merge_survival_results: 3

set-resources:
  TCGA_download:
    mem: 20G
    time: "4:00:00"
  rule_separate_cohorts:
    mem: 20G
    time: "4:00:00"
  biomaRt_download:
    mem: 4G
    time: "1:00:00"
  DESeq2_normalization:
    mem: 10G
    time: "4:00:00"
  survival_screening:
    mem: 10G
    time: "4:00:00"
  merge_survival_results:
    mem: 5G
    time: "1:00:00"

